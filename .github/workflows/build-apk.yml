name: Build Android APK

on:
  push:
    branches:
      - main
      - ui/feature-guidelines
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Standalone APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install

      - name: Generate Android native project (Expo Prebuild)
        working-directory: mobile
        run: npx expo prebuild --platform android --clean

      # Release, not debug: a debug APK leaves the JavaScript to a dev server, so it would not start on its own.
      # The API URL is baked in at build time; without it the app has no cloud OCR/TTS.
      - name: Build Android APK
        working-directory: mobile/android
        env:
          NODE_ENV: production
          EXPO_PUBLIC_API_BASE_URL: https://ocr-for-impaired-user.vercel.app
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-output
          cp mobile/android/app/build/outputs/apk/release/app-release.apk build-output/songKHEM-v1.0.0.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: songKHEM-Android-APK
          path: build-output/songKHEM-v1.0.0.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-preview
          name: "songKHEM Mobile v1.0.0 (Latest APK)"
          body: |
            ## songKHEM Mobile - Android APK Build
            Automated build from branch `${{ github.ref_name }}` (Commit: `${{ github.sha }}`).
            
            - Standalone Android APK for assistive Khmer document OCR & speech reading.
            - Includes on-device Tesseract OCR and offline voice pack.
          files: build-output/songKHEM-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
