name: Build Android APK

on:
  push:
    branches:
      - main
      - ui/feature-guidelines
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install

      - name: Generate Android native project (Expo Prebuild)
        working-directory: mobile
        run: npx expo prebuild --platform android --clean

      - name: Build Android APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-output
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk build-output/songKHEM-v1.0.0.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: songKHEM-Android-APK
          path: build-output/songKHEM-v1.0.0.apk
          retention-days: 30
