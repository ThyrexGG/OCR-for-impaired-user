name: Check Android build

on:
  push:
    branches:
      - main
      - ui/feature-guidelines
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Standalone APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install

      - name: Generate Android native project (Expo Prebuild)
        working-directory: mobile
        run: npx expo prebuild --platform android --clean

      # Release, not debug: a debug APK leaves the JavaScript to a dev server, so it would not start on its own.
      # This only checks that the app still builds. The repo is public, so nothing is published from here: an APK
      # that works needs the server's pass (EXPO_PUBLIC_APP_KEY), and those are built locally and shared privately.
      - name: Build Android APK
        working-directory: mobile/android
        env:
          NODE_ENV: production
          EXPO_PUBLIC_API_BASE_URL: https://ocr-for-impaired-user.vercel.app
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
