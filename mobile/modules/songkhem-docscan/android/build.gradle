plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.songkhemdocscan'
version = '1.0.0'

android {
  namespace "expo.modules.songkhemdocscan"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Same CameraX release expo-camera ships, so the two share one copy in the app
  def camerax_version = "1.6.0"
  implementation "androidx.camera:camera-core:${camerax_version}"
  implementation "androidx.camera:camera-camera2:${camerax_version}"
  implementation "androidx.camera:camera-lifecycle:${camerax_version}"
  implementation "androidx.camera:camera-view:${camerax_version}"
  // The future type CameraX returns from focus and torch calls (the app already ships this Guava)
  implementation "com.google.guava:guava:33.3.1-android"
}
